name: Testnet stack formatting

on:
  push:
    branches:
      - stellar/testnet-stack-post-32

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stellar/testnet-stack-post-32
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write lib/stellar/shared-issuer-signing-policy.ts tests/shared-issuer-issuance.test.ts tests/shared-issuer-signing-policy.test.ts
      - name: Commit canonical formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/lib/stellar/shared-issuer-signing-policy.ts web/tests/shared-issuer-issuance.test.ts web/tests/shared-issuer-signing-policy.test.ts
          git commit -m "style(stellar): apply canonical stack formatting"
          git push origin HEAD:stellar/testnet-stack-post-32
