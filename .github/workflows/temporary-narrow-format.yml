name: Temporary narrow formatter
on:
  push:
    branches:
      - feat/mvp-lite-immutable-issuance-intent
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[autoformat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-lite-immutable-issuance-intent
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format route
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write 'app/api/projects/[projectId]/issuance/route.ts'
          npm run format:check
      - name: Commit only route
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'web/app/api/projects/[projectId]/issuance/route.ts'
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize issuance route [autoformat]'
            git push origin HEAD:refs/heads/feat/mvp-lite-immutable-issuance-intent
          fi
