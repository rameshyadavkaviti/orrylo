name: contracts

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "contracts/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0 action code
        with:
          version: 28.0.0

      - name: Confirm pinned Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Add Soroban Wasm target
        run: rustup target add wasm32v1-none

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Upload generated lockfile for Phase 2 bootstrap
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase2-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run contract tests
        run: cargo test --workspace --locked

      - name: Build contract Wasm
        run: stellar contract build --locked

      - name: Run real Wasm constructor authorization tests
        run: cargo test --workspace --locked wasm_ -- --ignored

      - name: Verify locked contract interface
        run: contracts/foundation/check-interface.sh

      - name: Inspect contract interface
        run: stellar contract info interface --wasm target/wasm32v1-none/release/orrylo_foundation.wasm --output json-formatted
