name: contracts

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "contracts/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0 action code
        with:
          version: 28.0.0

      - name: Confirm pinned Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Confirm committed dependency lock
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run contract tests
        run: cargo test --workspace --locked

      - name: Build contract Wasm
        run: stellar contract build --locked

      - name: Run real Wasm constructor authorization tests
        run: cargo test --workspace --locked wasm_ -- --ignored

      - name: Verify locked contract interface
        run: contracts/foundation/check-interface.sh

      - name: Inspect contract interface
        run: stellar contract info interface --wasm target/wasm32v1-none/release/orrylo_foundation.wasm --output json-formatted
