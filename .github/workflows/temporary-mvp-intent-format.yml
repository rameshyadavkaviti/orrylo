name: Temporary MVP Lite intent formatter
on:
  push:
    branches: [feat/mvp-lite-immutable-issuance-intent]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[autoformat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-lite-immutable-issuance-intent
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Canonical Prettier for changed MVP Lite files
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write 'app/api/projects/[projectId]/issuance/route.ts' 'app/my-assets/[projectId]/layout.tsx' 'components/create-shared-token-form.tsx' 'components/confirm-initial-supply-intent.tsx' 'components/testnet-issuance-section.tsx' 'lib/server/projects/testnet-issuance-service.ts' 'tests/db/testnet-issuance.test.ts' 'tests/testnet-issuance-http.test.ts'
      - name: Commit formatter changes only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web
          if ! git diff --cached --quiet; then
            git commit -m 'style: format immutable issuance intent [autoformat]'
            git push origin HEAD:refs/heads/feat/mvp-lite-immutable-issuance-intent
          fi
