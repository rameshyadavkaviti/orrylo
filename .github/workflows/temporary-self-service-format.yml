name: Temporary self-service formatter
on:
  push:
    branches:
      - feat/self-service-testnet-issuance
    paths:
      - .github/workflows/temporary-self-service-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Format self-service UI
        working-directory: web
        run: |
          npm ci
          npx prettier --write components/create-shared-token-form.tsx
      - name: Commit formatting to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/create-shared-token-form.tsx
          if ! git diff --cached --quiet; then
            git commit -m "STYLE: finalize customer-success view formatting"
            git push origin HEAD:feat/self-service-testnet-issuance
          fi
