name: Temporary PR19 formatter
on:
  push:
    branches:
      - feat/testnet-metadata-publication
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[autoformat]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/testnet-metadata-publication
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format only remedied files
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write 'app/my-assets/[projectId]/page.tsx' 'app/p/[slug]/page.tsx' lib/server/persistence/metadata-publication-repository.ts lib/server/projects/metadata-publication-service.ts lib/server/projects/shared-asset-provenance.ts tests/db/metadata-publication.test.ts tests/db/migration-reconciliation.test.ts
      - name: Commit canonical formatting
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web
          if ! git diff --cached --quiet; then
            git commit -m 'style: format trusted metadata publication [autoformat]'
            git push origin HEAD:refs/heads/feat/testnet-metadata-publication
          fi
