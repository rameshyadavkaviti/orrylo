name: Activation readiness formatting

on:
  push:
    branches:
      - stellar/testnet-mvp-activation-readiness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stellar/testnet-mvp-activation-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write README.md lib/server/projects/testnet-activation-verifier.ts scripts/verify-testnet-activation.ts tests/testnet-activation-verifier.test.ts
      - name: Commit canonical formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/README.md web/lib/server/projects/testnet-activation-verifier.ts web/scripts/verify-testnet-activation.ts web/tests/testnet-activation-verifier.test.ts
          git commit -m "style(stellar): format activation readiness package"
          git push origin HEAD:stellar/testnet-mvp-activation-readiness
