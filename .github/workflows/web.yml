name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".gitignore"
      - "README.md"
      - "docs/SOURCE_OF_TRUTH.md"
  push:
    branches:
      - main
      - rebuild/clean-mvp
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
      - ".gitignore"
      - "README.md"
      - "docs/SOURCE_OF_TRUTH.md"

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orrylo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orrylo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/orrylo_test
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/orrylo_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/orrylo_test

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Confirm runtime
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build private Testnet signer
        run: npm run signer:build

      - name: Provision production-shaped app role
        run: |
          node --input-type=module <<'NODE'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          const [{ exists }] = await sql`
            SELECT EXISTS (
              SELECT 1
              FROM pg_catalog.pg_roles
              WHERE rolname = 'orrylo_app'
            ) AS "exists"
          `;
          if (!exists) {
            await sql.unsafe("CREATE ROLE orrylo_app LOGIN");
          }
          await sql.end({ timeout: 5 });
          NODE

      - name: Apply migrations
        run: npm run db:migrate

      - name: Restore production-shaped pre-011 app ACL fixture
        run: |
          node --input-type=module <<'NODE'
          import postgres from "postgres";
          const sql = postgres(process.env.DATABASE_URL, { max: 1 });
          await sql.unsafe(`
            GRANT UPDATE (signed_envelope_xdr_sha256)
              ON project_issuance_transaction_attempts TO orrylo_app
          `);
          await sql.end({ timeout: 5 });
          NODE

      - name: Verify schema read-only
        run: npm run db:verify:read-only

      - name: Database integration tests
        run: npm run test:db

      - name: Production build
        run: npm run build
