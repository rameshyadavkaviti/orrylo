name: Temporary PR 70 formatter
on:
  push:
    branches:
      - feat/self-service-testnet-issuance
    paths:
      - .github/workflows/temporary-pr70-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Format P1 changes
        working-directory: web
        run: |
          npm ci
          npx prettier --write \
            lib/projects/pending-customer-trustline.ts \
            lib/server/projects/customer-testnet-trustline.ts \
            app/api/projects/'[projectId]'/issuance/trustline/route.ts \
            components/customer-trustline-control.tsx \
            tests/pending-customer-trustline.test.ts \
            tests/customer-testnet-trustline.test.ts \
            tests/customer-trustline-http.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/
          if ! git diff --cached --quiet; then
            git commit -m "STYLE: format PR 70 P1 security remediation"
            git push origin HEAD:feat/self-service-testnet-issuance
          fi
