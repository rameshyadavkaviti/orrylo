name: Private signer formatting

on:
  push:
    branches:
      - stellar/private-railway-testnet-signer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stellar/private-railway-testnet-signer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write lib/server/projects/shared-issuance-runtime.ts lib/stellar/private-railway-signer.ts signer-service/private-testnet-signer.ts signer-service/tsconfig.json tests/private-railway-signer.test.ts tests/private-testnet-signer-service.test.ts tests/shared-issuance-orchestrator.test.ts
      - name: Commit canonical formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/lib/server/projects/shared-issuance-runtime.ts web/lib/stellar/private-railway-signer.ts web/signer-service/private-testnet-signer.ts web/signer-service/tsconfig.json web/tests/private-railway-signer.test.ts web/tests/private-testnet-signer-service.test.ts web/tests/shared-issuance-orchestrator.test.ts
          git commit -m "style(stellar): format private signer implementation"
          git push origin HEAD:stellar/private-railway-testnet-signer
