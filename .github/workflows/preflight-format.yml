name: Preflight formatting

on:
  push:
    branches:
      - feat/testnet-shared-issuer-preflight

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/testnet-shared-issuer-preflight
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prettier --write lib/stellar/shared-issuer-testnet-preflight.ts tests/shared-issuer-testnet-preflight.test.ts
      - name: Commit canonical formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/lib/stellar/shared-issuer-testnet-preflight.ts web/tests/shared-issuer-testnet-preflight.test.ts
          git commit -m "style: format Testnet preflight"
          git push origin HEAD:feat/testnet-shared-issuer-preflight
