name: Temporary ChangeTrust Test Formatter
on:
  push:
    branches:
      - feat/self-service-testnet-issuance
    paths:
      - .github/workflows/temporary-pr70-test-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Format final tests
        working-directory: web
        run: |
          npm ci
          npx prettier --write tests/schema-verification.test.ts tests/customer-trustline-http.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/
          if ! git diff --cached --quiet; then
            git commit -m "STYLE: format final protected ChangeTrust assertions"
            git push origin HEAD:feat/self-service-testnet-issuance
          fi
